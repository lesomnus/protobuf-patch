edition = "2023";

package patch;

// Presence is load-bearing in this file: `Field` distinguishes an unset
// identifier from an empty one, and `Range` distinguishes an open bound from a
// zero bound. EXPLICIT is the edition-2023 default, but it is pinned here so
// that a change to the default — or a well-meaning edit adding IMPLICIT — is a
// visible break rather than a silent one.
option features.field_presence = EXPLICIT;

option go_package = "github.com/lesomnus/protobuf-patch/patchpb";

// Key names EXACTLY ONE location inside a container.
//
// The `kind` arm must match the container it is resolved against:
//
//	container   | legal arm
//	------------+-----------------------------------------------
//	message     | field
//	list        | index
//	map         | map_key (matching the map's declared key type)
//
// Using an arm that does not match the container is an unconditional error.
//
// VACANCY. A Key can fail to reach existing content in two different ways, and
// the difference decides what an operation may do about it.
//
//   - NO SLOT — the address names no position at all: a field the message does
//     not declare, or an index outside [0, len). Nothing can ever be written
//     there, so every operation treats it as a MISSING TARGET.
//   - EMPTY SLOT — the address names a position that exists but holds nothing:
//     a map key with no entry under it. Every key of the map's declared type
//     is a valid address, so `assign` fills one (this is how a map entry comes
//     into existence at all) and `insert` requires it to be empty. Only
//     `remove` and `nest`, which need something already there, treat it as a
//     missing target.
//
// A declared message field is neither. It always exists as a position; whether
// it currently holds a value is PRESENCE, which is what `Test.want.exists`
// reports and which no operation treats as a missing target.
//
// A missing target is not itself a failure. What happens to one depends on
// where the Key appears:
//
//   - In `Selector.key` under `test`: it is READ. This is exactly what
//     `Test.want.exists` reports, and `Entry.on_missing` never applies.
//   - In `Selector.key` under any other kind: `Entry.on_missing` decides
//     (default: fail).
//   - In `Path.segments` or in `Location`: an unconditional error.
//     `Entry.on_missing` reaches only `Selector` targets.
//
// Key is deliberately single-valued: it is the only segment type permitted in
// `Path`, because a path must reach exactly one container. Multi-valued
// segments live in `Selector`, which is permitted only in `Entry.targets`.
message Key {
  oneof kind {
    // A field of a message.
    Field field = 1;

    // An element of a list.
    //
    // Negative values count from the end: the effective index is `len + index`.
    // This holds for EVERY operation — there is no per-operation off-by-one.
    // "One past the end" is not expressible here; use `Selector.append`.
    //
    // An index outside `[0, len)` after normalization names NO SLOT (above).
    sint64 index = 2;

    // An entry of a map.
    MapKey map_key = 3;
  }
}

// Field identifies a message field. It is a CONSTRAINT, not a mere selector:
// every identifier that is set must agree, and disagreement is an error rather
// than a fallback. This is what lets a stored Patch refuse to apply to a
// message whose fields were renamed or renumbered underneath it.
//
// Resolution, in order:
//  1. If `number` is set, resolve by number. Otherwise if `name` is set,
//     resolve by name. Otherwise resolve by `json_name`.
//     (`number` goes first because the field number is protobuf's stable
//     identity; names may be edited without a wire break.)
//  2. Every OTHER identifier that is set must equal the corresponding property
//     of the resolved field. Any disagreement is an error — NOT a vacancy, and
//     never subject to `Entry.on_missing`. Disagreement means the Patch was
//     authored against a different schema; that must never be skipped.
//
// If no identifier resolves to a declared field, the Key names NO SLOT (see
// `Key`), which every operation treats as a missing target.
//
// EXTENSIONS ARE NOT ADDRESSABLE, and are not vacancy either. A `number` that
// falls in one of the target message's extension ranges is an ERROR, never
// subject to `Entry.on_missing`. An extension is data the message really
// holds: calling it a missing target would let `test.exists = false` succeed
// about a value that is present, and would let `on_missing` silently skip an
// operation that was meant to change it. Both are exactly the outcomes this
// format exists to prevent, so it refuses rather than answers wrongly. An
// extension the reader has no descriptor for arrives as an unknown field on
// the target instead, and the preservation rule in `patch.Patch` already
// covers it. Should a revision make extensions addressable, it will do so with
// its own arm rather than by reinterpreting `number`.
//
// A Field with no identifier set is an error. A set-but-empty `name` or
// `json_name` is an error, since neither is a legal protobuf field name.
message Field {
  // The field's declared name, e.g. "user_id".
  string name = 1;

  // The field's ProtoJSON name, e.g. "userId" — the value of the field's
  // `json_name` if set, otherwise the lowerCamelCase derivation of `name`.
  // Set this when the patch is authored against a JSON view of the message.
  // It may be set alone, or together with `name`/`number` as a constraint.
  string json_name = 2;

  // The field number. Must be >= 1; 0 is not a legal field number.
  uint32 number = 3;
}

// MapKey identifies a map entry. The arm MUST match the map's declared key
// type; a mismatch is an error and is never coerced. In particular a numeric
// arm is NOT stringified onto a string-keyed map.
//
//	declared key type              | arm
//	-------------------------------+-----
//	string                         | s
//	int32, sint32, sfixed32        | i
//	int64, sint64, sfixed64        | i
//	uint32, fixed32                | u
//	uint64, fixed64                | u
//	bool                           | b
//
// (These are exactly protobuf's legal map key types; float, double, bytes,
// enum, and message keys do not exist.)
//
// The carried value MUST also lie within the declared key type's range: `i`
// against a `map<int32, V>` must lie in [-2^31, 2^31), `u` against a
// `map<uint32, V>` in [0, 2^32). A value outside that range is an ERROR — it
// is never truncated, and it is never a merely missing key that
// `Entry.on_missing` can skip.
//
// The empty string is a legal `s` key and is unambiguous here, because the
// oneof carries its own presence.
message MapKey {
  oneof kind {
    string s = 1;
    sint64 i = 2;
    uint64 u = 3;
    bool   b = 4;
  }
}

// Path navigates INTO a nested container before an operation is applied.
//
// A Path is ALWAYS relative to the container that the enclosing `Delta` is
// applied to; for the outermost Delta that is the root message. Empty
// `segments` addresses that container itself. A Path only descends: it can
// never reach a sibling or an ancestor, so a nested Delta cannot escape the
// container that `nest` handed it.
//
// Every container along the path must already exist, and a path that descends
// through a `Key` that reaches nothing is an error. A Patch never auto-creates intermediate
// containers, and `Entry.on_missing` never applies to a Path. (Create a
// container with an explicit `assign` in an earlier entry.)
//
// "Exist" is presence, not contents. A singular message field must be SET; an
// unset one is an error, because descending into it would have to create it.
// A repeated or map field has no presence in protobuf and therefore always
// exists as a container: an empty list or map may be descended into, and the
// operation simply finds nothing there. This is what lets a whole empty list
// be filled by addressing it with `container` scope.
message Path {
  repeated Key segments = 1;
}

// Selector names ZERO OR MORE locations inside a container. It is the segment
// type used by `Entry.targets`.
message Selector {
  oneof kind {
    // Exactly one location. Legal in every container.
    Key key = 1;

    // A contiguous span of list elements. Legal ONLY against a list.
    Range range = 2;

    // The position one past the last list element — the RFC 6901 "-" token.
    // Legal ONLY against a list, and only with `insert`, `move`, and `copy`,
    // each of which can grow a list. It is an error with `remove`, `assign`,
    // `test`, and `nest`, none of which can.
    //
    // This exists so that "append" has its own encoding instead of being
    // smuggled into `Key.index` as a magic value, which is what forces
    // negative indices to mean different things in different operations.
    Append append = 3;

    // The member of a `oneof` that is currently SET. Legal ONLY against a
    // message.
    //
    // A oneof names ZERO OR ONE location, which is why it belongs here and
    // not in `Key`. `Key` promises exactly one, and forcing a oneof into that
    // promise is what made `assign` undefined: there is no way to say which
    // member a value is meant for when two members share a type. As a
    // Selector nothing new has to be defined — it resolves to the set member
    // or to nothing, and every operation already says what it does with zero
    // or one location:
    //
    //	remove     clear the set member. Nothing set selects nothing, so the
    //	           entry is a no-op, exactly as an empty `Range` is.
    //	assign     overwrite the set member in place. The arm must match THAT
    //	           member's type; the document does not get to choose which
    //	           member is written.
    //	insert     the set member is occupied, so this fails. Nothing set
    //	           selects nothing.
    //	move/copy  write to the set member.
    //	nest       descend into the set member, which must be a container.
    //	test       reads the ONEOF ITSELF rather than the member, so that
    //	           `exists = false` is satisfiable. This is the carve-out
    //	           `test` already has for a missing target, applied here:
    //	           `want.exists` reports whether any member is set, and
    //	           `want.value` compares against the set member and fails when
    //	           there is none.
    //
    // Addressing the oneof instead of enumerating its members is also what
    // keeps a stored Patch correct when a member is ADDED later: an
    // enumeration silently stops covering the new one.
    //
    // A name the message does not declare as a oneof is a MISSING TARGET,
    // like an undeclared field. A SYNTHETIC oneof — the one protobuf
    // generates for a proto3 `optional` field — is an ERROR, because it would
    // be a second way to spell a field `Key.field` already addresses.
    Oneof oneof_member = 4;
  }
}

// Oneof identifies a oneof of a message by its declared name.
//
// A oneof has no field number, so there is nothing to pin a name against and
// no equivalent of the integrity check `Field` carries. It is a message rather
// than a bare string so that it can gain options later without burning a
// `Selector` arm.
message Oneof {
  // The oneof's declared name, e.g. "source". Required; the empty string is
  // not a legal oneof name.
  string name = 1;
}

// Range selects the list elements in the half-open interval [begin, end).
//
// Normalization, in order:
//  1. `begin` unset => 0.        `end` unset => len.
//  2. A negative bound v => len + v.
//  3. Both bounds are clamped to [0, len].
//
// After normalization, `begin >= end` selects NOTHING. That is a defined
// result, not a failure: the range is well-formed and its answer is empty.
// A Range never wraps around, and never selects a union of two spans — express
// that as two entries in `targets`.
//
// Examples for a list of length 5 (x = selected):
//
//	xxxxx  [_, _)   => [0, 5)   all elements
//	---xx  [-2, _)  => [3, 5)   last two
//	xxx--  [_, -2)  => [0, 3)   all but the last two
//	-xxx-  [1, 4)   => [1, 4)   the middle three
//	-----  [3, 2)   => empty    begin >= end
//	-----  [9, _)   => empty    clamped to [5, 5)
//
// `begin` and `end` share one normalization rule; unset and 0 are distinct.
//
// A Range never produces a missing target: it selects only indices that exist,
// so `Entry.on_missing` has no effect on one.
message Range {
  // Inclusive lower bound. Unset means 0.
  sint64 begin = 1;

  // Exclusive upper bound. Unset means the collection length.
  sint64 end = 2;
}

// Append is the position one past the last element of a list. It carries no
// data; it is a message rather than a bool so that it can gain options later
// without burning a `Selector` arm.
message Append {}

// Location names a source position for `move` and `copy`.
//
// It may name a container other than the one holding the targets — this is
// what makes cross-container move/copy expressible — but never one outside the
// enclosing `Delta`'s container.
message Location {
  // Where the source container is. Required: "the entry's own container" is an
  // explicit choice here, never an absence.
  oneof origin {
    // Relative to the enclosing `Delta`'s container, exactly like
    // `Entry.path`. Empty `segments` means that container itself.
    Path path = 1;

    // The container reached by `Entry.path`, i.e. where the targets live.
    SameContainer same_container = 3;
  }

  // The source position within that container. Required; an unset `key` is an
  // error, and a `key` that reaches nothing is an error (never skipped).
  Key key = 2;
}

// SameContainer selects the container reached by `Entry.path`. It carries no
// data; it is a message so that it can gain options later.
message SameContainer {}
