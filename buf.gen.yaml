version: v2
# No `inputs`: buf generate defaults to ".", which is the workspace, so both
# modules build together and conformance/case.proto can resolve its import of
# patch/patch.proto.
plugins:
  - local: [go, tool, google.golang.org/protobuf/cmd/protoc-gen-go]
    out: .
    opt:
      - module=github.com/lesomnus/protobuf-patch
      - default_api_level=API_OPAQUE
